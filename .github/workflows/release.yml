name: Release

# Runs on the MIRROR repo (aroma-zone/terraform-provider-klaviyo). This
# file ships there via the monorepo's subtree-split release workflow.
#
# Trigger: a tag matching v<semver> appearing on the mirror (pushed by
# the monorepo's mirror job). Builds cross-platform binaries with
# GoReleaser, signs SHA256SUMS with GPG, and publishes a GitHub release.
# The Terraform Registry picks up the release from the mirror.

on:
  push:
    tags:
      - 'v*'
  # Escape hatch: the tag event is lost if it reaches the mirror
  # before GitHub has registered this workflow (which is what
  # happens on the very first release into an empty mirror).
  # Re-run from the Actions tab against the tag instead of
  # burning a version number.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase:      ${{ secrets.PASSPHRASE }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT:  ${{ steps.gpg.outputs.fingerprint }}

  # Publish the same archives to the GHCR OCI mirror, so OpenTofu can
  # install these providers without the public registry. Consumed via
  # an oci_mirror block in .tofurc — see the README.
  #
  # Reuses the archives GoReleaser just published rather than building
  # again: one set of bytes, covered by the SHA256SUMS this release
  # already signed.
  oci-mirror:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.3.0

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve version
        id: v
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release tags are v<semver>; the OCI tag is the bare version.
          # On workflow_dispatch this is whatever ref was selected, so
          # fail loudly rather than tagging the mirror with a branch name.
          VERSION="${REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Ref '$REF_NAME' is not a v<semver> tag — dispatch this workflow against a release tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

      - name: Download the release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG:      ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' --dir dist
          ls -1 dist

      - name: Assemble and push the OCI artifact
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail

          # One image manifest per platform, each carrying the provider
          # zip as its single layer. OpenTofu requires artifactType
          # application/vnd.opentofu.provider-target here and the layer
          # media type archive/zip.
          platforms=()
          for zip in dist/*_"${VERSION}"_*.zip; do
            base="$(basename "$zip" .zip)"
            platform="${base#*_${VERSION}_}"   # e.g. linux_amd64
            os="${platform%%_*}"
            arch="${platform#*_}"

            oras push \
              --artifact-type application/vnd.opentofu.provider-target \
              --artifact-platform "${os}/${arch}" \
              --oci-layout "tmp-layout:${platform}" \
              "${zip}:archive/zip"

            platforms+=("$platform")
          done

          if [ "${#platforms[@]}" -eq 0 ]; then
            echo "No archives matched dist/*_${VERSION}_*.zip" >&2
            exit 1
          fi
          echo "Packaged ${#platforms[@]} platforms: ${platforms[*]}"

          # Gather them under one index tagged with the bare version.
          oras manifest index create \
            --artifact-type="application/vnd.opentofu.provider" \
            --oci-layout "tmp-layout:${VERSION}" \
            "${platforms[@]}"

          # ${type} in the consumer's repository_template resolves to the
          # provider type from the source address, which is this repo's
          # name minus the terraform-provider- prefix.
          DEST="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY##*/}:${VERSION}"
          oras cp --from-oci-layout "tmp-layout:${VERSION}" "$DEST"
          echo "Published $DEST"
